name: Fetch Daily Work

on:
  schedule:
    - cron: "23 11,13,14 * * 1-5" # hourly-ish 11:23, 13:23, 14:23 UTC - 12:23/14:23/15:23 Lisbon, right before the standup
  workflow_dispatch:
    inputs:
      since:
        description: "ISO start of window (e.g. 2026-09-10T15:00:00Z). Empty = yesterday at window start."
        required: false
        default: ""

# Required secrets:
#   GH_USER            — GitHub handle to query commits and PRs for
#   STANDUP_TIME       — daily window start, "HH:MM" 24h format (default 15:00)
#   STANDUP_TZ         — IANA timezone of the window start (default Europe/Lisbon)
#   GH_SEARCH_SCOPE    — GitHub search scope, space-separated. Supports orgs and/or repos:
#                        e.g.: "org:my-org" or "org:my-org org:another-org" or "repo:owner/repo1 repo:owner/repo2"
#   GH_TOKEN           — PAT with `repo` + `gist` scopes (search + gist cache)
#   GIST_ID            — Gist ID where results are cached
#
# Single-token setup: GH_TOKEN is the only credential, used for both the
# searches and the Gist cache.
#
# Notes:
#   - The commit search API only indexes commits on the DEFAULT branch. Work on
#     feature branches is still captured via PR commit headlines below.
#   - Open PRs are fetched too, so in-progress work shows in the daily digest
#     even before merge.
#   - Weekends: the Monday run uses Friday's window start as SINCE.
jobs:
  fetch-daily:
    runs-on: ubuntu-latest
    env:
      GH_USER: ${{ secrets.GH_USER }}
      STANDUP_TIME: ${{ secrets.STANDUP_TIME }}
      STANDUP_TZ: ${{ secrets.STANDUP_TZ }}
      GH_SEARCH_SCOPE: ${{ secrets.GH_SEARCH_SCOPE }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight token check
        run: |
          HTTP=$(curl -s -w '%{http_code}' -o /tmp/user.json -H "Authorization: token $GH_TOKEN" https://api.github.com/user) || true
          echo "GH_TOKEN check: HTTP $HTTP - $(jq -r '.login // .message' /tmp/user.json)"
          HTTP=$(curl -s -w '%{http_code}' -o /tmp/gist-check.json -H "Authorization: token $GH_TOKEN" "https://api.github.com/gists/$GIST_ID") || true
          echo "Gist access check: HTTP $HTTP - $(jq -r '.id // .message' /tmp/gist-check.json)"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Gist preflight failed - GH_TOKEN missing gist scope or GIST_ID wrong"
          fi

      - name: Compute window
        run: |
          # Manual override wins
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE="${{ github.event.inputs.since }}"
            echo "Window overridden manually: $SINCE"
          else
            WINDOW_START="${STANDUP_TIME:-15:00}"
            WINDOW_TZ="${STANDUP_TZ:-Europe/Lisbon}"
            # Roll back to the previous workday: Monday (and weekend runs) use Friday
            DOW=$(TZ="$WINDOW_TZ" date +%u) # 1=Mon ... 7=Sun
            case "$DOW" in
              1) AGO="3 days ago" ;;
              7) AGO="2 days ago" ;;
              *) AGO="yesterday" ;;
            esac
            # Window start rendered in its timezone with its UTC offset
            # (e.g. 2026-09-10T15:00:00+01:00) — valid ISO 8601 for search
            SINCE=$(TZ="$WINDOW_TZ" date -d "$AGO $WINDOW_START" +%Y-%m-%dT%H:%M:%S%:z)
            echo "Window starts $WINDOW_START $WINDOW_TZ ($AGO) → since $SINCE"
          fi
          echo "SINCE=$SINCE" >> "$GITHUB_ENV"
          echo "UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Fetch commits and PRs, cache to Gist
        run: |
          set -e
          SCOPE="${GH_SEARCH_SCOPE:-}"
          TARGET_USER="${GH_USER:-${GITHUB_REPOSITORY_OWNER}}"
          COMMIT_QUERY="author:${TARGET_USER} ${SCOPE} author-date:>=${SINCE}"
          PR_MERGED_QUERY="is:pr is:merged author:${TARGET_USER} ${SCOPE} merged:>=${SINCE}"
          PR_OPEN_QUERY="is:pr is:open author:${TARGET_USER} ${SCOPE} updated:>=${SINCE}"

          echo "Commit query: $COMMIT_QUERY"
          echo "PR merged query: $PR_MERGED_QUERY"
          echo "PR open query:   $PR_OPEN_QUERY"

          # Commits (REST search — default-branch commits only, up to 50)
          HTTP=$(curl -s -w '%{http_code}' -o /tmp/commits-raw.json \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/commits?per_page=50&q=$(jq -rn --arg q "$COMMIT_QUERY" '$q|@uri')") || true
          echo "Commit search HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            jq '[.items[] | {sha: .sha[0:7], repo: .repository.name, date: .commit.author.date, headline: (.commit.message | split("\n")[0]), message: .commit.message, url: .html_url}]' /tmp/commits-raw.json > /tmp/commits.json
          else
            echo "::warning::Commit search failed (HTTP $HTTP)"
            head -c 400 /tmp/commits-raw.json; echo
            echo "[]" > /tmp/commits.json
          fi
          echo "Commits found: $(jq 'length' /tmp/commits.json)"

          # PRs (GraphQL — same query family as DailyDevTeamOrganizer).
          # Two searches: merged since window + open (in-progress work shows in the digest).
          GRAPHQL_QUERY='query($q:String!){search(query:$q,type:ISSUE,first:20){nodes{...on PullRequest{title number repository{name} body headRefName baseRefName state mergedAt commits(last:5){nodes{commit{messageHeadline}}}}}}}'
          PR_SHAPE='[(.data.search.nodes//[])[]|select(.title!=null)|(.body//""|gsub("[*#`_~]";"")|gsub("[\r\n]+";" ")|gsub("  +";" ")|ltrimstr(" ")) as $b|{title,number,repo:.repository.name,body:(if ($b|length)>0 then ($b|.[0:200]) else ([(.commits.nodes//[])[].commit.messageHeadline]|join(" \u00b7 ")|.[0:200]) end),branch:.headRefName,baseBranch:.baseRefName,state,mergedAt}]'

          fetch_prs() {
            curl -s -w '%{http_code}' -o "$2" \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST "https://api.github.com/graphql" \
              -d "$(jq -nc --arg q "$1" --arg gql "$GRAPHQL_QUERY" '{query:$gql,variables:{q:$q}}')" > /tmp/prs-http.txt \
              || echo 000 > /tmp/prs-http.txt
          }

          fetch_prs "$PR_MERGED_QUERY" /tmp/prs-merged-raw.json
          HTTP=$(cat /tmp/prs-http.txt)
          echo "Merged PR search HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            ERRORS=$(jq -c '.errors // empty' /tmp/prs-merged-raw.json)
            [ -n "$ERRORS" ] && echo "::warning::GraphQL errors: $ERRORS"
            jq "$PR_SHAPE" /tmp/prs-merged-raw.json > /tmp/prs-merged.json
          else
            echo "::warning::Merged PR search failed (HTTP $HTTP)"
            head -c 400 /tmp/prs-merged-raw.json; echo
            echo "[]" > /tmp/prs-merged.json
          fi

          fetch_prs "$PR_OPEN_QUERY" /tmp/prs-open-raw.json
          HTTP=$(cat /tmp/prs-http.txt)
          echo "Open PR search HTTP: $HTTP"
          if [ "$HTTP" = "200" ]; then
            ERRORS=$(jq -c '.errors // empty' /tmp/prs-open-raw.json)
            [ -n "$ERRORS" ] && echo "::warning::GraphQL errors: $ERRORS"
            jq "$PR_SHAPE" /tmp/prs-open-raw.json > /tmp/prs-open.json
          else
            echo "::warning::Open PR search failed (HTTP $HTTP)"
            head -c 400 /tmp/prs-open-raw.json; echo
            echo "[]" > /tmp/prs-open.json
          fi

          # Dedupe by repo+number (PR numbers collide across repos), merged entries
          # win over stale open ones (search indexing can lag behind a merge),
          # then newest first
          jq -s 'add | sort_by(.mergedAt // "") | reverse | unique_by(.repo + "#" + (.number|tostring)) | sort_by(.mergedAt // .updatedAt // "") | reverse' \
            /tmp/prs-merged.json /tmp/prs-open.json > /tmp/prs.json
          echo "PRs found: $(jq 'length' /tmp/prs.json) (merged: $(jq 'length' /tmp/prs-merged.json), open: $(jq 'length' /tmp/prs-open.json))"

          # Zero-results trace: isolate handle / scope / SSO / window problems
          if [ "$(jq 'length' /tmp/commits.json)" = "0" ] && [ "$(jq 'length' /tmp/prs.json)" = "0" ]; then
            echo "------------------------------------------"
            echo "TRACE: zero results - running search matrix"
            curl -sI -H "Authorization: token $GH_TOKEN" https://api.github.com/user | grep -i '^x-oauth-scopes' || echo "x-oauth-scopes: (header missing)"
            trace() {
              local H T
              H=$(curl -s -w '%{http_code}' -o /tmp/trace.json \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/search/commits?q=$(jq -rn --arg q "$1" '$q|@uri')") || H=000
              T=$(jq -r '.total_count // "-"' /tmp/trace.json 2>/dev/null)
              echo "  $2 → HTTP $H, total_count $T"
            }
            trace "author:${TARGET_USER}" "author only"
            trace "author:${TARGET_USER} author-date:>=${SINCE}" "author + since (no scope)"
            trace "author:${TARGET_USER} ${SCOPE}" "author + scope (no since)"
            trace "author:${TARGET_USER} ${SCOPE} author-date:>=${SINCE}" "author + scope + since (actual query)"
            echo "Interpretation:"
            echo "  'author only' = 0      → commits authored by an email not linked to the GitHub account, or handle typo in GH_USER"
            echo "  'author only' > 0, '+ scope' = 0 → SSO: authorize the PAT for the orgs (Developer settings → PAT → Configure SSO), or org/repo name typo in GH_SEARCH_SCOPE"
            echo "  '+ scope' > 0, '+ scope + since' = 0 → work exists but outside the window or on non-default branches"
          fi

          # AI resume (optional, Groq): turns the fetched work into a first-person
          # standup speech stored in aiResume. Skipped when GROQ_KEY is unset;
          # on any failure aiResume stays empty and the page just hides the section.
          if [ -n "$GROQ_KEY" ] && { [ "$(jq 'length' /tmp/commits.json)" -gt 0 ] || [ "$(jq 'length' /tmp/prs.json)" -gt 0 ]; }; then
            node "${GITHUB_WORKSPACE}/scripts/generate-ai-resume.js" || echo "::warning::AI resume generation failed - continuing without it"
          else
            echo -n "" > /tmp/ai-resume.txt
          fi

          # Merge into daily-data.json (speech is the no-AI template slot,
          # aiResume is the Groq-generated one - kept separate on purpose)
          jq -nc --rawfile commits /tmp/commits.json --rawfile prs /tmp/prs.json --rawfile aiResume /tmp/ai-resume.txt \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg since "$SINCE" --arg until "$UNTIL" \
            '{updatedAt:$updatedAt, window:{since:$since, until:$until}, commits:($commits|fromjson), prs:($prs|fromjson), speech:"", aiResume:$aiResume}' \
          > /tmp/daily-data.json

          # Patch Gist (single token: GH_TOKEN)
          HTTP=$(jq -n --rawfile content /tmp/daily-data.json \
            '{files: {"daily-data.json": {content: $content}}}' \
          | curl -s -w '%{http_code}' -o /tmp/gist-resp.json -X PATCH "https://api.github.com/gists/$GIST_ID" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d @-) || true
          if [ "$HTTP" = "200" ]; then
            echo "Done — daily data cached at $(date -u)"
          else
            echo "::error::Gist PATCH failed (HTTP $HTTP)"
            head -c 400 /tmp/gist-resp.json; echo
            exit 1
          fi

      - name: Daily Work Summary
        run: |
          echo "------------------------------------------"
          echo "Window: $SINCE → $UNTIL"
          echo "Commits:"
          jq -r '.[] | "  [\(.repo)] \(.headline)"' /tmp/commits.json
          echo "PRs:"
          jq -r '.[] | "  [\(.repo) #\(.number)] \(.title) (\(.state))"' /tmp/prs.json
          echo "------------------------------------------"
